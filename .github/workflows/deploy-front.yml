name: Deploy Front

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem do front
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: renanmassini/agenda-front:latest
          build-args: |
            VITE_API_URL=https://macroloapp.com.br/api

      - name: Atualizar front na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            docker pull renanmassini/agenda-front:latest
            docker rm -f agenda_front || true
            docker run -d \
              --name agenda_front \
              --restart always \
              -p 3000:80 \
              renanmassini/agenda-front:latest
